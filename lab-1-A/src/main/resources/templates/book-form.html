<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        form input{
            display: block;
        }
        button{
            display: block;
        }
    </style>
</head>
<body>
<h1>Add new book</h1>
<form method="post" th:action="@{${book == null ? '/books/add' : '/books/edit/' + book.id}}">
    <label>
        Title:
        <input type="text"
               name="title"
               th:value="${book != null ? book.title : ''}"
               required>
    </label>
    <label>
        Genre:
        <input type="text"
               name="genre"
               th:value="${book != null ? book.genre : ''}"
               required>
    </label>
    <label>
        Average Rating:
        <input type="number"
               step="0.1"
               name="averageRating"
               th:value="${book != null ? book.averageRating : ''}"
               required>
    </label>
    <label>
        Author:
        <select name="authorId">
            <option th:each="author : ${authors}"
                    th:value="${author.id}"
                    th:text="${author.name} + ' ' + ${author.surname}"
                    required></option>
        </select>
    </label>
    <button type="submit">Submit</button>
</form>
</body>
</html>
