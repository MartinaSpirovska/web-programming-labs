<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete book</title>
</head>
<body>
<form method="post" th:action="@{'/books/delete/{id}' (id=${bookId})}">
    <div class="container">
        <h1>Delete Book</h1>
        <p th:text="'Are you sure you want to delete ' + ${book.title} + '?'"></p>

        <div class="clearfix">
            <a href="/books">
                <button type="button">Cancel</button>
            </a>
            <button type="submit">Delete</button>
        </div>
    </div>
</form>
</body>
</html>
