<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        form input{
            display: block;
        }
        button{
            display: block;
        }
    </style>
</head>
<body>
<h1>Add new author</h1>
<form method="post" th:action="@{${author == null ? '/authors/add' : '/authors/edit/' + author.id}}">
    <label>
        Name:
        <input type="text"
               name="name"
               th:value="${author != null ? author.name : ''}"
               required>
    </label>
    <label>
        Surname:
        <input type="text"
               name="surname"
               th:value="${author != null ? author.surname : ''}"
               required>
    </label>
    <label>
        Country:
        <input type="text"
               name="country"
               th:value="${author != null ? author.country : ''}"
               required>
    </label>
    <label>
        Biography:
        <input type="text"
               name="biography"
               th:value="${author != null ? author.biography : ''}"
               required>
    </label>
    <button type="submit">Submit</button>
</form>
</body>
</html>
