<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
<div>
    <h1>Authors</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Country</th>
            <th>Biography</th>
            <th>Actions</th>
        </tr>
        <tr th:each="author : ${authors}">
            <td th:text="${author.name} + ' ' + ${author.surname}"></td>
            <td th:text="${author.country}"></td>
            <td th:text="${author.biography}"></td>
            <td><a th:href="@{'/authors/edit/{id}' (id=${author.id})}">
                <button type="button">Edit</button>
            </a>
                <a th:href="@{'/authors/delete/{id}' (id=${author.id})}">
                    <button type="button">Delete</button>
                </a></td>
        </tr>
    </table>

    <form method="get" action="/authors/add">
        <button type="submit">Add new author</button>
    </form>
</div>
</body>
</html>
