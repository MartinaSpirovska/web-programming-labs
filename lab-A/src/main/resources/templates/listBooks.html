<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Book Reservation - Welcome and choose a Book</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        form {
            margin-top: 20px;
        }
        .book-option {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .book-option:hover {
            background-color: #f5f5f5;
        }
        table, th, td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
<header>
    <h1>Welcome to our Book Reservation App</h1>
</header>
<main>
    <a href="/books/add">Add new book</a>
    <form action="/books" method="GET">
        <label for="title">Title:
            <input type="text" name="title" id="title">
        </label>
        <label for="averageRating">Average Rating:
            <input type="number" min="0" max="10" step="0.1" name="averageRating" id="averageRating">
        </label>
        <input type="submit" value="Search books">
    </form>
    <form action="/bookReservation" method="POST">

        <h2>Choose a book:</h2>
        <!-- Display radio buttons for each book,
             the value should be the book title
             and the displayed text should be:
             Title: <book_title>, Genre: <book_genre>, Rating: <average_rating> -->
        <table>
            <tr>
                <th></th>
                <th>Title</th>
                <th>Genre</th>
                <th>Rating</th>
                <th>Author</th>
                <th>Actions</th>
            </tr>
            <tr th:each="book : ${books}">
                <td>
                    <input type="radio" name="title" th:value="${book.title}" required>
                </td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.genre}"></td>
                <td th:text="${book.averageRating}"></td>
                <td th:text="${book.author.name} + ' ' + ${book.author.surname}"></td>
                <td><a th:href="@{'/books/edit/{id}' (id=${book.getId()})}">
                    <button type="button">Edit</button>
                </a>
                    <a th:href="@{'/books/delete/{id}' (id=${book.getId()})}">
                        <button type="button">Delete</button>
                    </a></td>
            </tr>
        </table>

<!--        <div th:each="book : ${books}">-->
<!--            <label>-->
<!--                <input type="radio"-->
<!--                       name="title"-->
<!--                       th:value="${book.getTitle()}"-->
<!--                       required>-->
<!--                <span th:text="'Title: ' + ${book.getTitle()} +', Genre: ' + ${book.getGenre()} + ', Rating: ' + ${book.getAverageRating()} + ', Author: ' + ${book.author.name} + ' ' + ${book.author.surname}"></span>-->
<!--            </label>-->
<!--        </div>-->
        <h2>Enter your information:</h2>
        <label>Your Name:</label>
        <input type="text" name="readerName" required><br/>
        <label>Your Address:</label>
        <input type="text" name="readerAddress" required><br/>

        <h2>Choose number of copies:</h2>
        <input type="number" name="numCopies" min="1" max="10" required><br/>
        <br/>
        <input type="submit" value="Reserve Book">
    </form>
</main>
</body>
</html>
